name: Scansione bandi GrantScout

on:
  schedule:
    # Ogni 6 ore. GitHub esegue i cron con qualche minuto di ritardo nei
    # momenti di picco: è normale non partire esattamente al minuto 0.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
    # Permette anche di lanciare la scansione a mano dalla scheda "Actions"
    # del repository su GitHub, senza aspettare il prossimo giro.

# Se una scansione e' ancora in corso (es. quella schedulata ogni 6 ore)
# quando viene lanciata anche una scansione a mano, la seconda ora ASPETTA
# che la prima finisca invece di girare in parallelo -- due esecuzioni
# contemporanee scriverebbero entrambe su Firestore (stessa collection
# "calls", stesso meta/status) potendosi sovrascrivere a vicenda in modo
# imprevedibile. cancel-in-progress:false vuol dire "accoda, non annullare
# quella in corso".
concurrency:
  group: grantscout-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Rete di sicurezza: ogni chiamata HTTP nello script ha gia' un timeout
    # esplicito (vedi HTTP_TIMEOUT/JINA_TIMEOUT in scripts/scan.py), quindi
    # non dovrebbe mai bloccarsi per davvero -- ma senza questo limite un
    # blocco imprevisto (bug in una libreria, o comportamento anomalo di un
    # sito) potrebbe far girare il job per il timeout di default di GitHub
    # Actions (360 minuti), consumando inutilmente i minuti gratuiti del
    # piano e ritardando di ore la scoperta del problema.
    timeout-minutes: 15
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: pip install -r scripts/requirements.txt

      - name: Esegui lo scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Se il workflow è stato avviato a mano (pulsante "Run workflow"),
          # forza comunque una scansione vera, anche se la frequenza scelta
          # nell'app non sarebbe ancora scaduta — altrimenti un test manuale
          # potrebbe non fare nulla, cosa poco intuitiva.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/scan.py